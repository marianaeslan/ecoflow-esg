name: CI/CD EcoFlow ESG

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ecoflow-esg

jobs:
  # ---------------------------------------------------------------
  # 1) BUILD + TESTES
  # ---------------------------------------------------------------
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # 2) BUILD E PUSH DA IMAGEM DOCKER (nao roda em Pull Request)
  # ---------------------------------------------------------------
  docker:
    name: Build e Push da Imagem
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 3) DEPLOY STAGING
  #    So roda se a variavel ENABLE_DEPLOY for 'true'
  #    (Settings > Secrets and variables > Actions > Variables)
  # ---------------------------------------------------------------
  deploy-staging:
    name: Deploy Staging
    needs: docker
    if: github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare host and log in to GHCR
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            mkdir -p ~/ecoflow-staging
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: SCP files to staging host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.staging.yml,docker/oracle/init/*,scripts/deploy.sh"
          target: "~/ecoflow-staging"

      - name: Run deploy on staging host
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          ORACLE_SYS_PASSWORD: ${{ secrets.STAGING_ORACLE_SYS_PASSWORD }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: IMAGE_NAME,IMAGE_TAG,DB_USER,DB_PASSWORD,ORACLE_SYS_PASSWORD,JWT_SECRET
          script: |
            set -euo pipefail
            cd ~/ecoflow-staging
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh docker-compose.staging.yml 8081

  # ---------------------------------------------------------------
  # 4) DEPLOY PRODUCAO (somente main, com aprovacao manual)
  #    Configure "Required reviewers" no environment "production".
  # ---------------------------------------------------------------
  deploy-production:
    name: Deploy Producao
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare host and log in to GHCR
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            mkdir -p ~/ecoflow-prod
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: SCP files to production host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.prod.yml,docker/oracle/init/*,scripts/deploy.sh"
          target: "~/ecoflow-prod"

      - name: Run deploy on production host
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          ORACLE_SYS_PASSWORD: ${{ secrets.PROD_ORACLE_SYS_PASSWORD }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: IMAGE_NAME,IMAGE_TAG,DB_USER,DB_PASSWORD,ORACLE_SYS_PASSWORD,JWT_SECRET
          script: |
            set -euo pipefail
            cd ~/ecoflow-prod
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh docker-compose.prod.yml 8080