version: '3.8'

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: ecoflow-oracle-staging
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${STAGING_ORACLE_SYS_PASSWORD}
      APP_USER: ${DB_USER}
      APP_USER_PASSWORD: ${STAGING_DB_PASSWORD}
    volumes:
      - oracle-data-staging:/opt/oracle/oradata
      - ./docker/oracle/init:/container-entrypoint-initdb.d:ro
    networks:
      - ecoflow-staging-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s

  api:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-staging}
    container_name: ecoflow-api-staging
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${STAGING_DB_PASSWORD}
      JWT_SECRET: ${STAGING_JWT_SECRET}
      SPRING_PROFILES_ACTIVE: staging
    ports:
      - "${API_PORT:-8081}:8080"
    volumes:
      - api-logs-staging:/app/logs
    networks:
      - ecoflow-staging-net

volumes:
  oracle-data-staging:
  api-logs-staging:

networks:
  ecoflow-staging-net:
    driver: bridge

