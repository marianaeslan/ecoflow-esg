spring.application.name=ecoflow

# Externalize datasource settings (defaults for local development)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ecoflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ecoflow123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.addformat_sql=true

# Expose only health endpoint and do not show details in responses by default
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Do not include the database health check by default so the /actuator/health
# endpoint remains available when the external DB is not yet reachable.
management.health.db.enabled=false

