version: '3.8'

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: ecoflow-oracle-prod
    restart: always
    environment:
      ORACLE_PASSWORD: ${PROD_ORACLE_SYS_PASSWORD}
      APP_USER: ${DB_USER}
      APP_USER_PASSWORD: ${PROD_DB_PASSWORD}
    volumes:
      - oracle-data-prod:/opt/oracle/oradata
      - ./docker/oracle/init:/container-entrypoint-initdb.d:ro
    networks:
      - ecoflow-prod-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: ecoflow-api-prod
    restart: always
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PROD_DB_PASSWORD}
      JWT_SECRET: ${PROD_JWT_SECRET}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - api-logs-prod:/app/logs
    networks:
      - ecoflow-prod-net
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  oracle-data-prod:
  api-logs-prod:

networks:
  ecoflow-prod-net:
    driver: bridge

